name: faith-laundry-e2e-test

services:
  test-db:
    image: postgres:16-alpine
    container_name: laundry-postgres-e2e
    restart: unless-stopped
    environment:
      POSTGRES_DB: laundry_e2e_db
      POSTGRES_USER: e2e_user
      POSTGRES_PASSWORD: e2e_password
    ports:
      - "5434:5432" # E2E tests run on a separate port from Dev (5433)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e_user -d laundry_e2e_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend/infrastructure/db-init/01-enable-pgcrypto.sql:/docker-entrypoint-initdb.d/01-enable-pgcrypto.sql:ro
