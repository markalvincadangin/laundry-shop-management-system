# Faith Laundry Shop — Nginx Reverse Proxy
# Proxies /api/* to backend, /* to frontend
# SSL: Generate certificates before starting: sh docker/nginx/generate-ssl.sh
#      For production domains, use Let's Encrypt (certbot) instead of self-signed certs.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Upstream backends
    upstream backend {
        server backend:8080;
    }
    upstream frontend {
        server frontend:3000;
    }

    # HTTP — redirect to HTTPS for production security
    server {
        listen 80;
        server_name _;

        # Health check (non-sensitive, may remain on HTTP)
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Enforce HTTPS for all other routes
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — Enabled by default for production security
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /actuator/ {
            proxy_pass http://backend/actuator/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /swagger-ui {
            proxy_pass http://backend/swagger-ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /swagger-ui.html {
            proxy_pass http://backend/swagger-ui.html;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /v3/api-docs {
            proxy_pass http://backend/v3/api-docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
