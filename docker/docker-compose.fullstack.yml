# Faith Laundry Shop — Full Stack (Backend + Frontend + PostgreSQL)
# Run from project root: docker compose -f docker/docker-compose.fullstack.yml up -d
# Requires .env with DB_PASSWORD (and optionally DB_NAME, DB_USER, DB_PORT)

services:
  postgres:
    image: postgres:16
    container_name: laundry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-laundry_db}
      POSTGRES_USER: ${DB_USER:-laundry_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/01-enable-pgcrypto.sql:/docker-entrypoint-initdb.d/01-enable-pgcrypto.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-laundry_user} -d ${DB_NAME:-laundry_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: laundry-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-laundry_db}
      DB_USER: ${DB_USER:-laundry_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-change-me-use-at-least-32-characters-in-production}
      ALLOWED_ORIGIN: http://localhost:3000
    ports:
      - "${SPRING_PORT:-8080}:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    container_name: laundry-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
