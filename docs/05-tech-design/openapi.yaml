openapi: 3.0.3
info:
  title: Faith Laundry Shop Management System API
  version: 1.0.0
  description: >
    REST API contract for the Faith Laundry Shop Management System.
    Aligned to user stories (US-xx), business rules (BR-xx), and ERD.

servers:
  - url: http://localhost:8080

tags:
  - name: System
  - name: Auth
  - name: Customers
  - name: ServiceRates
  - name: Orders
  - name: Payments
  - name: Reports
  - name: ClientAlerts
  - name: AuditLog
  - name: Users

paths:
  /api/v1/health:
    get:
      summary: Health check
      description: Liveness probe for API availability.
      tags: [System]
      responses:
        "200":
          description: OK

  # -------------------------
  # AUTH
  # -------------------------
  /api/v1/auth/login:
    post:
      summary: Login
      description: |
        User authentication for role-based access (Admin / Staff).
        Sets an HTTP-only cookie (access_token) in addition to returning the JWT in the body.
        Supports: US-11.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/logout:
    post:
      summary: Logout
      description: Clears the HTTP-only JWT cookie (sets max-age=0).
      tags: [Auth]
      responses:
        "200":
          description: Logout success

  /api/v1/auth/me:
    get:
      summary: Get current user
      description: Returns the authenticated user's identity based on JWT/Session.
      tags: [Auth]
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------
  # CUSTOMERS
  # -------------------------
  /api/v1/customers:
    post:
      summary: Create customer
      description: |
        Creates a customer with first name, last name, contact number.
        Supports: US-01. Enforces: BR-REC-01.
      tags: [Customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: Search customers
      description: |
        Search customers by name or contact number.
        Supports: US-01 (customer selection for order intake).
        Returns a PageResponse (includes first field).
      tags: [Customers]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Free-text search by name or contact (optional)
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Registered from date (inclusive)
        - in: query
          name: to
          schema: { type: string, format: date }
          description: Registered to date (inclusive)
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 15 }
        - in: query
          name: sortBy
          schema: { type: string, default: lastName }
        - in: query
          name: sortDir
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: Paginated customers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPageResponse"

  /api/v1/customers/{customerId}:
    get:
      summary: Get customer by ID
      description: |
        Supports: US-01.
      tags: [Customers]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      summary: Update customer
      description: Updates customer contact details (firstName, lastName, contactNumber).
      tags: [Customers]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------
  # SERVICE RATES
  # -------------------------
  /api/v1/service-rates:
    get:
      summary: List service rates
      description: |
        Returns pricing rules (load, 8 kg limit, extra minute rate).
        Supports: US-02 (order intake form).
      tags: [ServiceRates]
      parameters:
        - in: query
          name: activeOnly
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Service rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRateResponse"

    post:
      summary: Create service rate (Admin only)
      description: |
        Creates a new service rate. Requires ADMIN role.
      tags: [ServiceRates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRateRequest"
      responses:
        "201":
          description: Rate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRateResponse"
        "400":
          description: Validation error
        "403":
          description: Forbidden - Admin only

  /api/v1/service-rates/active:
    get:
      summary: Get active service rate
      description: |
        Returns the active rate used for order pricing (default).
        Supports: US-02. Enforces: BR-PR-01, BR-PR-02, BR-PR-03.
      tags: [ServiceRates]
      responses:
        "200":
          description: Active rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRateResponse"
        "404":
          description: No active rate configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/service-rates/{rateId}:
    patch:
      summary: Update service rate (Admin only)
      description: |
        Updates pricing rules. Admin controls pricing without code changes.
        Requires ADMIN role.
        Supports: ERD note "Admin can update without code changes".
      tags: [ServiceRates]
      parameters:
        - in: path
          name: rateId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRateRequest"
      responses:
        "200":
          description: Updated rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRateResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Admin only
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------
  # ORDERS
  # -------------------------
  /api/v1/orders:
    post:
      summary: Create laundry order
      description: |
        Creates order with automatic pricing (loads, extra minutes, add-ons).
        Generates unique reference number. Sets initial status RECEIVED.
        createdByUserId is sourced from JWT when authenticated; falls back to body value.
        Returns 401 if neither JWT nor body provides the user identity.
        Supports: US-01, US-02. Enforces: BR-PR-01, BR-PR-02, BR-PR-03, BR-PR-04, BR-OL-01, BR-OL-02.
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Validation or business rule error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized (no user identity)

    get:
      summary: List or search orders
      description: |
        Returns orders with pagination and optional filters.
        Supports sortBy and sortDir params (default: createdAt desc).
        Supports free-text search via q param.
        Supports: US-01, US-03, US-07.
      tags: [Orders]
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - in: query
          name: paymentStatus
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Start date (inclusive)
        - in: query
          name: to
          schema: { type: string, format: date }
          description: End date (inclusive)
        - in: query
          name: q
          schema: { type: string }
          description: Free-text search (reference number, customer name, etc.)
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
        - in: query
          name: sortBy
          schema: { type: string, default: createdAt }
        - in: query
          name: sortDir
          schema: { type: string, enum: [asc, desc], default: desc }
        - in: query
          name: customerId
          schema: { type: integer, format: int64 }
          description: Filter by specific customer ID
        - in: query
          name: serviceRateId
          schema: { type: integer }
          description: Filter by service type (Rate ID)
      responses:
        "200":
          description: Paginated orders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPageResponse"

  /api/v1/orders/preview:
    post:
      summary: Preview order pricing
      description: |
        Computes order totals (loads, base amount, extra minutes, add-ons, grand total)
        without creating an order. Uses active service rate. Supports live price preview.
        Supports: US-02.
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPreviewRequest"
      responses:
        "200":
          description: Price preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPreviewResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/stats:
    get:
      summary: Dashboard order stats
      description: |
        Returns counts for staff dashboard: today's orders, in progress, ready for pickup, unpaid, today's revenue.
        Supports: UI/UX improvement plan.
      tags: [Orders]
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
          description: "Date for today (default: current date)"
      responses:
        "200":
          description: Order stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatsResponse"

  /api/v1/orders/reference/{referenceNumber}:
    get:
      summary: Track order by reference number
      description: |
        Public endpoint for customer tracking. Returns limited data (no internal IDs).
        Includes weightKg and totalLoads in addition to status/payment info.
        Supports: US-04. Enforces: BR-NOTIF-02, BR-OL-01.
      tags: [Orders]
      parameters:
        - in: path
          name: referenceNumber
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order tracking view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTrackingResponse"
        "404":
          description: Reference not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{orderId}:
    get:
      summary: Get order by ID
      description: |
        Supports: US-03, US-05, US-06.
      tags: [Orders]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      summary: Update order details (extra minutes, add-ons)
      description: |
        Updates extra minutes and/or add-ons, recalculates totals.
        Allowed only when order is unpaid and not released.
        Client interview: "extended washing time due to excessive dirt — ₱1 per extra minute".
      tags: [Orders]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Validation or business rule error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{orderId}/status:
    patch:
      summary: Update order status
      description: |
        Updates status and records change in audit logs.
        changedByUserId is sourced from JWT when authenticated; falls back to body value.
        Returns 401 if neither JWT nor body provides the user identity.
        Supports: US-03, US-05. Enforces: BR-OL-03, BR-OL-04, BR-OL-05.
      tags: [Orders]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Invalid transition or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized (no user identity)
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------
  # PAYMENTS
  # -------------------------
  /api/v1/payments:
    get:
      summary: List payments
      description: |
        Returns payments with pagination and optional filters.
        Supports: US-07.
      tags: [Payments]
      parameters:
        - in: query
          name: orderId
          schema: { type: integer, format: int64 }
        - in: query
          name: q
          schema: { type: string }
          description: Search by reference number, customer name, or transaction ID
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Start date (inclusive)
        - in: query
          name: to
          schema: { type: string, format: date }
          description: End date (inclusive)
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
        - in: query
          name: sortBy
          schema: { type: string, default: paymentDate }
        - in: query
          name: sortDir
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Paginated payments list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPageResponse"

    post:
      summary: Record payment for order
      description: |
        Records payment. One payment per order. MVP: amount must equal order grand total.
        receivedByUserId is sourced from JWT when authenticated; falls back to body value.
        Returns 401 if neither JWT nor body provides the user identity.
        paymentMethod defaults to CASH if not provided.
        Supports: US-06. Enforces: BR-PAY-02, BR-PAY-03, BR-PAY-04.
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: Validation or amount mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized (no user identity)

  /api/v1/payments/{paymentId}:
    get:
      summary: Get payment by ID
      description: |
        Supports: US-07.
      tags: [Payments]
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/payments/order/{orderId}/void:
    post:
      summary: Void payment for order
      description: |
        Voids payment record and reverts order to UNPAID (or VOIDED).
        Supports: BR-PAY-06.
      tags: [Payments]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204":
          description: Payment voided
        "404":
          description: Order or payment not found

  # -------------------------
  # CLIENT ALERTS
  # -------------------------
  /api/v1/client-alerts:
    get:
      summary: List or search client alerts
      description: |
        Returns client alerts with pagination and optional filters.
        Ordered by createdAt descending by default.
        Supports: US-10.
      tags: [ClientAlerts]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Search by message, reference number, or customer name
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, SENT, FAILED] }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 15 }
        - in: query
          name: sortBy
          schema: { type: string, default: createdAt }
        - in: query
          name: sortDir
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Paginated client alerts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientAlertPageResponse"

  /api/v1/client-alerts/{id}/read:
    patch:
      summary: Mark alert as read
      tags: [ClientAlerts]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Success

  /api/v1/client-alerts/read-all:
    patch:
      summary: Mark all alerts as read
      tags: [ClientAlerts]
      responses:
        "200":
          description: Success

  # -------------------------
  # AUDIT LOGS
  # -------------------------
  /api/v1/audit-logs:
    get:
      summary: List or search audit logs
      description: Returns forensic audit logs of system mutations (Admin only).
      tags: [AuditLog]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Search by table name, record ID, or user
        - in: query
          name: action
          schema: { type: string }
          description: Filter by action type (e.g., ORDER_CREATE)
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
        - in: query
          name: sortBy
          schema: { type: string, default: createdAt }
        - in: query
          name: sortDir
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPageResponse"
        "403":
          description: Forbidden - Admin only

  # -------------------------
  # USERS (Staff Management)
  # -------------------------
  /api/v1/users:
    get:
      summary: List or search users
      description: |
        Returns a complete list of all staff and admin accounts with pagination.
        Requires ADMIN role.
        Supports: US-11 (Admin audit & directory view).
      tags: [Users]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Search by username, firstName, or lastName
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
        - in: query
          name: sortBy
          schema: { type: string, default: username }
        - in: query
          name: sortDir
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: Paginated users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPageResponse"
        "403":
          description: Forbidden - Admin only

  /api/v1/users/stats:
    get:
      summary: Get user statistics
      description: Returns global counts of admins, active staff, and total users.
      tags: [Users]
      responses:
        "200":
          description: User statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStatsResponse"
        "403":
          description: Forbidden - Admin only

    post:
      summary: Create user
      description: |
        Onboards a new staff or admin member. Hashes password automatically.
        Requires ADMIN role.
        Supports: US-11 (Administrative control).
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Username already exists or validation error
        "403":
          description: Forbidden - Admin only

  /api/v1/users/{userId}:
    patch:
      summary: Update user profile
      description: |
        Updates names, role, or password. Username remains immutable.
        Requires ADMIN role.
        Supports: US-11.
      tags: [Users]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          description: Forbidden - Admin only
        "404":
          description: User not found

  /api/v1/users/{userId}/toggle-status:
    patch:
      summary: Toggle user status
      description: |
        Activates or deactivates a user account (soft-archive).
        Requires ADMIN role.
        Supports: US-11.
      tags: [Users]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Status toggled
        "403":
          description: Forbidden - Admin only
        "404":
          description: User not found

  # -------------------------
  # REPORTS
  # -------------------------
  /api/v1/reports/sales/daily:
    get:
      summary: Daily sales report
      description: |
        Aggregates income from payments for the given date.
        Requires ADMIN role.
        Supports: US-08. Enforces: BR-REC-01, BR-PAY-04.
      tags: [Reports]
      parameters:
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Daily sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySalesReportResponse"
        "403":
          description: Forbidden - Admin only

  /api/v1/reports/sales/monthly:
    get:
      summary: Monthly sales report
      description: |
        Aggregates income from payments for the given month.
        Requires ADMIN role.
        Supports: US-09. Enforces: BR-REC-01, BR-PAY-04.
      tags: [Reports]
      parameters:
        - in: query
          name: year
          required: true
          schema: { type: integer, minimum: 1, example: 2026 }
        - in: query
          name: month
          required: true
          schema: { type: integer, minimum: 1, maximum: 12, example: 2 }
      responses:
        "200":
          description: Monthly sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodSalesReportResponse"
        "403":
          description: Forbidden - Admin only

  /api/v1/reports/sales/yearly:
    get:
      summary: Yearly sales report
      description: |
        Aggregates income from payments for the given year.
        Requires ADMIN role.
        Supports: US-09. Enforces: BR-REC-01, BR-PAY-04.
      tags: [Reports]
      parameters:
        - in: query
          name: year
          required: true
          schema: { type: integer, minimum: 1, example: 2026 }
      responses:
        "200":
          description: Yearly sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodSalesReportResponse"
        "403":
          description: Forbidden - Admin only

  /api/v1/reports/sales/trend:
    get:
      summary: Sales trend report
      description: |
        Returns a list of daily sales aggregates (income, orders) for a given range.
        Max range is 31 days.
        Requires ADMIN role.
      tags: [Reports]
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Sales trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailySalesReportResponse"
        "403":
          description: Forbidden - Admin only

components:
  schemas:
    # -------------------------
    # COMMON
    # -------------------------
    ErrorResponse:
      type: object
      properties:
        code: { type: string, example: "VALIDATION_ERROR" }
        message: { type: string, example: "weightKg must be greater than 0" }
        details:
          type: array
          items: { type: string }
      required: [code, message]

    # -------------------------
    # AUTH
    # -------------------------
    LoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
      required: [username, password]

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: "JWT token" }
        role: { type: string, description: "User role string (ADMIN or STAFF)" }
      required: [token, role]

    CurrentUserResponse:
      type: object
      properties:
        userId: { type: string, description: "UUID string" }
        username: { type: string }
        role: { type: string, description: "User role string (ADMIN or STAFF)" }
      required: [userId, username, role]

    # -------------------------
    # ENUMS
    # -------------------------
    UserRole:
      type: string
      enum: [ADMIN, STAFF]

    OrderStatus:
      type: string
      enum: [RECEIVED, WASHING, DRYING, FOLDING, READY_FOR_PICKUP, RELEASED, CANCELLED]

    PaymentStatus:
      type: string
      enum: [UNPAID, PAID, PARTIAL, VOIDED, REFUNDED]

    PaymentMethod:
      type: string
      enum: [CASH, GCASH, BANK_TRANSFER]

    ClientAlertStatus:
      type: string
      enum: [PENDING, SENT, FAILED]

    # -------------------------
    # CUSTOMERS
    # -------------------------
    CreateCustomerRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        contactNumber: { type: string }
      required: [firstName, lastName, contactNumber]

    CustomerResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        firstName: { type: string }
        lastName: { type: string }
        contactNumber: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, firstName, lastName, contactNumber, isActive]

    CustomerPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/CustomerResponse"
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
      required: [content, page, size, totalElements, totalPages, first, last]

    # -------------------------
    # SERVICE RATES
    # -------------------------
    ServiceRateResponse:
      type: object
      properties:
        id: { type: integer }
        serviceName: { type: string }
        basePricePerLoad: { type: number, format: double }
        kgLimitPerLoad: { type: number, format: double }
        pricePerExtraMinute: { type: number, format: double }
        isActive: { type: boolean }
      required: [id, serviceName, basePricePerLoad, kgLimitPerLoad, pricePerExtraMinute, isActive]

    UpdateServiceRateRequest:
      type: object
      properties:
        serviceName: { type: string }
        basePricePerLoad: { type: number, format: double }
        kgLimitPerLoad: { type: number, format: double }
        pricePerExtraMinute: { type: number, format: double }
        isActive: { type: boolean }

    CreateServiceRateRequest:
      type: object
      properties:
        serviceName: { type: string }
        basePricePerLoad: { type: number, format: double }
        kgLimitPerLoad: { type: number, format: double }
        pricePerExtraMinute: { type: number, format: double }
        isActive: { type: boolean, default: true }
      required: [serviceName, basePricePerLoad, kgLimitPerLoad, pricePerExtraMinute]

    # -------------------------
    # ORDERS
    # -------------------------
    CreateOrderRequest:
      type: object
      properties:
        customerId: { type: integer, format: int64 }
        createdByUserId:
          type: string
          format: uuid
          description: "Optional — overridden by JWT principal when authenticated."
        customer:
          $ref: "#/components/schemas/CreateCustomerRequest"
        weightKg: { type: number, format: double }
        extraMinutes: { type: integer, default: 0, minimum: 0 }
        initialAddOns:
          type: array
          items:
            $ref: "#/components/schemas/AddOnInput"
      required: [weightKg]

    AddOnInput:
      type: object
      properties:
        name: { type: string }
        price: { type: number, format: double }
        quantity: { type: integer, default: 1 }
      required: [name, price]

    OrderPreviewRequest:
      type: object
      properties:
        weightKg: { type: number, format: double }
        extraMinutes: { type: integer, default: 0 }
        serviceType: { type: string }
        initialAddOns:
          type: array
          items:
            $ref: "#/components/schemas/AddOnInput"
      required: [weightKg]

    OrderPreviewResponse:
      type: object
      properties:
        totalLoads: { type: integer }
        baseAmount: { type: number, format: double }
        extraMinutesAmount: { type: number, format: double }
        addonsTotalAmount: { type: number, format: double }
        grandTotal: { type: number, format: double }
      required: [totalLoads, baseAmount, extraMinutesAmount, addonsTotalAmount, grandTotal]

    OrderStatsResponse:
      type: object
      properties:
        todaysOrders: { type: integer }
        inProgress: { type: integer }
        readyForPickup: { type: integer }
        unpaidOrders: { type: integer }
        todaysRevenue: { type: number, format: double }
      required: [todaysOrders, inProgress, readyForPickup, unpaidOrders, todaysRevenue]

    UpdateOrderRequest:
      type: object
      properties:
        extraMinutes: { type: integer, minimum: 0 }
        addOns:
          type: array
          items:
            $ref: "#/components/schemas/AddOnInput"

    UpdateOrderStatusRequest:
      type: object
      properties:
        newStatus:
          type: string
          description: "Target OrderStatus value (e.g. WASHING, READY_FOR_PICKUP)."
        notes: { type: string }
        changedByUserId:
          type: string
          format: uuid
          description: "Optional — overridden by JWT principal when authenticated."
      required: [newStatus]

    OrderResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        referenceNumber: { type: string }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        createdByUserId: { type: string, description: "UUID string" }
        createdByUsername: { type: string, description: "Username of the staff who created the order" }
        serviceRateId: { type: integer }
        weightKg: { type: number, format: double }
        totalLoads: { type: integer }
        extraMinutes: { type: integer }
        baseAmount: { type: number, format: double }
        extraMinutesAmount: { type: number, format: double }
        addonsTotalAmount: { type: number, format: double }
        grandTotal: { type: number, format: double }
        addOns:
          type: array
          items:
            $ref: "#/components/schemas/AddOnResponse"
        currentStatus: { type: string }
        paymentStatus: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        auditLogs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogResponse"
      required: [id, referenceNumber, customerId, weightKg, totalLoads, baseAmount, extraMinutesAmount, addonsTotalAmount, grandTotal, currentStatus, paymentStatus]

    AddOnResponse:
      type: object
      properties:
        name: { type: string }
        price: { type: number, format: double }
        quantity: { type: integer }
      required: [name, price, quantity]

    OrderPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponse"
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
      required: [content, page, size, totalElements, totalPages, first, last]

    PaymentPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PaymentResponse"
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
      required: [content, page, size, totalElements, totalPages, first, last]

    OrderTrackingResponse:
      type: object
      properties:
        referenceNumber: { type: string }
        currentStatus: { type: string }
        customerName: { type: string }
        contactNumber: { type: string }
        createdAt: { type: string, format: date-time }
        grandTotal: { type: number, format: double }
        paymentStatus: { type: string }
        weightKg: { type: number, format: double }
        totalLoads: { type: integer }
      required: [referenceNumber, currentStatus, customerName, createdAt, paymentStatus]

    # -------------------------
    # PAYMENTS
    # -------------------------
    CreatePaymentRequest:
      type: object
      properties:
        orderId: { type: integer, format: int64 }
        amountPaid: { type: number, format: double }
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
          description: "Defaults to CASH if not provided."
        receivedByUserId:
          type: string
          format: uuid
          description: "Optional — overridden by JWT principal when authenticated."
        paymentReference:
          type: string
          description: "Reference / Transaction ID for non-cash payments (GCash, Bank)."
      required: [orderId, amountPaid]

    PaymentResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        orderReferenceNumber: { type: string }
        customerName: { type: string }
        amountPaid: { type: number, format: double }
        paymentMethod: { type: string }
        receivedByUserId: { type: string, description: "UUID string" }
        receivedByUsername: { type: string, description: "Username of the staff who received the payment" }
        paymentDate: { type: string, format: date-time }
        remarks: { type: string }
        paymentReference: { type: string, description: "Reference / Transaction ID for digital payments." }
      required: [id, orderId, amountPaid, paymentMethod, paymentDate]

    # -------------------------
    # CLIENT ALERTS
    # -------------------------
    ClientAlertResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        referenceNumber: { type: string }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        contactNumber: { type: string }
        message: { type: string }
        status: { type: string, description: "ClientAlertStatus: PENDING, SENT, FAILED" }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
      required: [id, orderId, customerId, message, status]

    ClientAlertPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ClientAlertResponse"
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
      required: [content, page, size, totalElements, totalPages, first, last]

    # -------------------------
    # REPORTS
    # -------------------------
    DailySalesReportResponse:
      type: object
      properties:
        date: { type: string, format: date }
        totalIncome: { type: number, format: double }
        paidOrdersCount: { type: integer }
        revenueByMethod:
          type: object
          additionalProperties:
            type: number
            format: double
          description: "Revenue breakdown by payment method."
      required: [date, totalIncome, paidOrdersCount]

    PeriodSalesReportResponse:
      type: object
      properties:
        period: { type: string }
        totalIncome: { type: number, format: double }
        paidOrdersCount: { type: integer }
      required: [period, totalIncome, paidOrdersCount]

    # -------------------------
    # AUDIT LOG
    # -------------------------
    AuditLogPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogResponse"
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
      required: [content, page, size, totalElements, totalPages, first, last]

    AuditLogResponse:
      type: object
      description: Audit record of a system action. Capture point-in-time state for forensic inspection.
      properties:
        id: { type: integer, format: int64 }
        actor: { type: string, description: "Username who performed the action" }
        operation: 
          type: string
          enum: [INSERT, UPDATE, DELETE, USER_LOGIN, USER_LOGOUT, PAYMENT_RECORD, ORDER_STATUS_UPDATE]
          description: "Type of state change"
        entityType: { type: string, description: "Type of record affected (e.g., Order, Payment)" }
        entityId: { type: string, description: "Primary key of the affected record" }
        oldState: { type: object, description: "Forensic snapshot of state before mutation" }
        newState: { type: object, description: "Forensic snapshot of state after mutation" }
        createdAt: { type: string, format: date-time, description: "Timestamp in UTC" }
        methodName: { type: string, description: "System method intercepted for this audit" }
        description: { type: string, description: "Human-readable description of the audit event" }
      required: [id, actor, operation, createdAt]

    # -------------------------
    # USERS
    # -------------------------
    CreateUserRequest:
      type: object
      properties:
        username: { type: string, minLength: 4, maxLength: 50 }
        password: { type: string, minLength: 6 }
        role:
          $ref: "#/components/schemas/UserRole"
        firstName: { type: string }
        lastName: { type: string }
      required: [username, password, role, firstName, lastName]

    UpdateUserRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        role:
          $ref: "#/components/schemas/UserRole"
        password: { type: string, minLength: 6 }

    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role:
          $ref: "#/components/schemas/UserRole"
        firstName: { type: string }
        lastName: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, username, role, firstName, lastName, isActive, createdAt, updatedAt]

    UserPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
      required: [content, page, size, totalElements, totalPages, first, last]
    UserStatsResponse:
      type: object
      properties:
        totalAdmins: { type: integer }
        totalActiveStaff: { type: integer }
        totalUsers: { type: integer }
      required: [totalAdmins, totalActiveStaff, totalUsers]
