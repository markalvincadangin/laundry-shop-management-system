openapi: 3.0.3
info:
  title: Faith Laundry Shop Management System API
  version: 1.0.0
  description: >
    REST API contract for the Faith Laundry Shop Management System.
    Aligned to user stories (US-xx), business rules (BR-xx), and ERD.

servers:
  - url: http://localhost:8080

tags:
  - name: System
  - name: Auth
  - name: Users
  - name: Customers
  - name: ServiceRates
  - name: Orders
  - name: Payments
  - name: Reports
  - name: Notifications

paths:
  /api/v1/health:
    get:
      summary: Health check
      description: Liveness probe for API availability.
      tags: [System]
      responses:
        "200":
          description: OK

  # -------------------------
  # AUTH
  # -------------------------
  /api/v1/auth/login:
    post:
      summary: Login
      description: |
        User authentication for role-based access (Owner / Staff).
        Supports: US-11.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------
  # CUSTOMERS
  # -------------------------
  /api/v1/customers:
    post:
      summary: Create customer
      description: |
        Creates a customer with first name, last name, contact number.
        Supports: US-01. Enforces: BR-REC-01.
      tags: [Customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: Search customers
      description: |
        Search customers by name or contact number.
        Supports: US-01 (customer selection for order intake).
      tags: [Customers]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Free-text search by name or contact (optional)
      responses:
        "200":
          description: Customers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerResponse"

  /api/v1/customers/{customerId}:
    get:
      summary: Get customer by ID
      description: |
        Supports: US-01.
      tags: [Customers]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------
  # SERVICE RATES (dynamic pricing)
  # -------------------------
  /api/v1/service-rates:
    get:
      summary: List service rates
      description: |
        Returns pricing rules (load, 8 kg limit, extra minute rate).
        Supports: US-02 (order intake form).
      tags: [ServiceRates]
      parameters:
        - in: query
          name: activeOnly
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Service rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRateResponse"

  /api/v1/service-rates/active:
    get:
      summary: Get active service rate
      description: |
        Returns the active rate used for order pricing (default).
        Supports: US-02. Enforces: BR-PR-01, BR-PR-02, BR-PR-03.
      tags: [ServiceRates]
      responses:
        "200":
          description: Active rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRateResponse"
        "404":
          description: No active rate configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/service-rates/{rateId}:
    patch:
      summary: Update service rate (Owner only)
      description: |
        Updates pricing rules. Owner controls pricing without code changes.
        Supports: ERD note "Owner can update without code changes".
      tags: [ServiceRates]
      parameters:
        - in: path
          name: rateId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRateRequest"
      responses:
        "200":
          description: Updated rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRateResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------
  # ORDERS
  # -------------------------
  /api/v1/orders:
    post:
      summary: Create laundry order
      description: |
        Creates order with automatic pricing (loads, extra minutes, add-ons).
        Generates unique reference number. Sets initial status RECEIVED.
        Supports: US-01, US-02. Enforces: BR-PR-01, BR-PR-02, BR-PR-03, BR-PR-04, BR-OL-01, BR-OL-02.
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Validation or business rule error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/preview:
    post:
      summary: Preview order pricing
      description: |
        Computes order totals (loads, base amount, extra minutes, add-ons, grand total)
        without creating an order. Uses active service rate. Supports live price preview.
        Supports: US-02.
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPreviewRequest"
      responses:
        "200":
          description: Price preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPreviewResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: List or search orders
      description: |
        Returns orders with pagination and optional filters.
        Supports: US-01, US-03, US-07.
      tags: [Orders]
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - in: query
          name: paymentStatus
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Start date (inclusive)
        - in: query
          name: to
          schema: { type: string, format: date }
          description: End date (inclusive)
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated orders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPageResponse"

  /api/v1/orders/stats:
    get:
      summary: Dashboard order stats
      description: |
        Returns counts for staff dashboard: today's orders, in progress, ready for pickup, unpaid.
        Supports: UI/UX improvement plan.
      tags: [Orders]
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
          description: "Date for today (default: current date)"
      responses:
        "200":
          description: Order stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatsResponse"

  /api/v1/orders/{orderId}:
    get:
      summary: Get order by ID
      description: | 
        Supports: US-03, US-05, US-06.
      tags: [Orders]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      summary: Update order details (extra minutes, add-ons)
      description: |
        Updates extra minutes and/or add-ons, recalculates totals.
        Allowed only when order is unpaid and not released.
        Client interview: "extended washing time due to excessive dirt — ₱1 per extra minute".
      tags: [Orders]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Validation or business rule error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/reference/{referenceNumber}:
    get:
      summary: Track order by reference number
      description: |
        Public endpoint for customer tracking. Returns limited data (no internal IDs).
        Supports: US-04. Enforces: BR-NOTIF-02, BR-OL-01.
      tags: [Orders]
      parameters:
        - in: path
          name: referenceNumber
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order tracking view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTrackingResponse"
        "404":
          description: Reference not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{orderId}/status:
    patch:
      summary: Update order status
      description: |
        Updates status and records change in order_status_logs.
        Supports: US-03, US-05. Enforces: BR-OL-03, BR-OL-04, BR-OL-05.
      tags: [Orders]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Invalid transition or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # OUT OF SCOPE FOR MVP - Dynamic add-ons after order creation
  # /api/v1/orders/{orderId}/add-ons:
  #   post:
  #     summary: Add add-on charge to order
  #     description: |
  #       Adds optional add-on (e.g., fabric conditioner). Recalculates grand total.
  #       Supports: US-02. Enforces: BR-PR-04.
  #     tags: [Orders]
  #     parameters:
  #       - in: path
  #         name: orderId
  #         required: true
  #         schema: { type: integer, format: int64 }
  #     requestBody:
  #       required: true
  #       content:
  #         application/json:
  #           schema:
  #             $ref: "#/components/schemas/AddOrderAddOnRequest"
  #     responses:
  #       "200":
  #         description: Updated order (totals recalculated)
  #         content:
  #           application/json:
  #             schema:
  #               $ref: "#/components/schemas/OrderResponse"
  #       "400":
  #         description: Validation error
  #         content:
  #           application/json:
  #             schema:
  #               $ref: "#/components/schemas/ErrorResponse"
  #       "404":
  #         description: Order not found
  #         content:
  #           application/json:
  #             schema:
  #               $ref: "#/components/schemas/ErrorResponse"

  # -------------------------
  # PAYMENTS
  # -------------------------
  /api/v1/payments:
    get:
      summary: List payments
      description: |
        Returns payments with pagination and optional filters.
        Supports: US-07.
      tags: [Payments]
      parameters:
        - in: query
          name: orderId
          schema: { type: integer, format: int64 }
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Start date (inclusive)
        - in: query
          name: to
          schema: { type: string, format: date }
          description: End date (inclusive)
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated payments list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPageResponse"
    post:
      summary: Record payment for order
      description: |
        Records payment. One payment per order. MVP: amount must equal order grand total.
        Supports: US-06. Enforces: BR-PAY-02, BR-PAY-03, BR-PAY-04.
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: Validation or amount mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/payments/{paymentId}:
    get:
      summary: Get payment by ID
      description: | 
        Supports: US-07.
      tags: [Payments]
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------
  # NOTIFICATIONS
  # -------------------------
  /api/v1/notifications:
    get:
      summary: List notifications
      description: |
        Returns all notifications (staff view).
        Supports: US-10. Enforces: BR-NOTIF-01.
      tags: [Notifications]
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationResponse"

  # -------------------------
  # REPORTS
  # -------------------------
  /api/v1/reports/sales/daily:
    get:
      summary: Daily sales report
      description: |
        Aggregates income from payments for the given date.
        Supports: US-08. Enforces: BR-REC-01, BR-PAY-04.
      tags: [Reports]
      parameters:
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Daily sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySalesReportResponse"

  /api/v1/reports/sales/monthly:
    get:
      summary: Monthly sales report
      description: |
        Aggregates income from payments for the given month.
        Supports: US-09. Enforces: BR-REC-01, BR-PAY-04.
      tags: [Reports]
      parameters:
        - in: query
          name: year
          required: true
          schema: { type: integer, example: 2026 }
        - in: query
          name: month
          required: true
          schema: { type: integer, minimum: 1, maximum: 12, example: 2 }
      responses:
        "200":
          description: Monthly sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodSalesReportResponse"

  /api/v1/reports/sales/yearly:
    get:
      summary: Yearly sales report
      description: |
        Aggregates income from payments for the given year.
        Supports: US-09. Enforces: BR-REC-01, BR-PAY-04.
      tags: [Reports]
      parameters:
        - in: query
          name: year
          required: true
          schema: { type: integer, example: 2026 }
      responses:
        "200":
          description: Yearly sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodSalesReportResponse"

components:
  schemas:
    # -------------------------
    # COMMON
    # -------------------------
    ErrorResponse:
      type: object
      properties:
        code: { type: string, example: "VALIDATION_ERROR" }
        message: { type: string, example: "weight_kg must be greater than 0" }
        details:
          type: array
          items: { type: string }
      required: [code, message]

    # -------------------------
    # AUTH
    # -------------------------
    LoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
      required: [username, password]

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: "JWT token" }
        role:
          $ref: "#/components/schemas/UserRole"
      required: [token, role]

    # -------------------------
    # ENUMS (canonical lifecycle values)
    # -------------------------
    UserRole:
      type: string
      enum: [OWNER, STAFF]

    OrderStatus:
      type: string
      enum: [RECEIVED, WASHING, DRYING, FOLDING, READY_FOR_PICKUP, RELEASED, CANCELLED]

    PaymentStatus:
      type: string
      enum: [UNPAID, PAID, PARTIAL]

    PaymentMethod:
      type: string
      enum: [CASH, GCASH, BANK_TRANSFER]

    NotificationStatus:
      type: string
      enum: [PENDING, SENT, FAILED]

    # -------------------------
    # CUSTOMERS
    # -------------------------
    CreateCustomerRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        contactNumber: { type: string }
      required: [firstName, lastName, contactNumber]

    CustomerResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        firstName: { type: string }
        lastName: { type: string }
        contactNumber: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, firstName, lastName, contactNumber]

    # -------------------------
    # SERVICE RATES
    # -------------------------
    ServiceRateResponse:
      type: object
      properties:
        id: { type: integer }
        serviceName: { type: string }
        basePricePerLoad: { type: number, format: double, description: "₱120 per load (BR-PR-01)" }
        kgLimitPerLoad: { type: number, format: double, description: "8 kg per load (BR-PR-01)" }
        pricePerExtraMinute: { type: number, format: double, description: "₱1 per extra minute (BR-PR-03)" }
        isActive: { type: boolean }
      required: [id, serviceName, basePricePerLoad, kgLimitPerLoad, pricePerExtraMinute, isActive]

    UpdateServiceRateRequest:
      type: object
      properties:
        serviceName: { type: string }
        basePricePerLoad: { type: number, format: double }
        kgLimitPerLoad: { type: number, format: double }
        pricePerExtraMinute: { type: number, format: double }
        isActive: { type: boolean }

    # -------------------------
    # ORDERS
    # -------------------------
    CreateOrderRequest:
      type: object
      properties:
        customerId:
          type: integer
          format: int64
          description: "Existing customer ID"
        createdByUserId:
          type: string
          format: uuid
          description: "User creating the order. Required until auth (Phase 9)."
        customer:
          $ref: "#/components/schemas/CreateCustomerRequest"
        # serviceRateId:
        #   type: integer
        #   description: "Rate to apply; if omitted, uses active rate (OUT OF SCOPE FOR MVP)"
        weightKg:
          type: number
          format: double
          description: "Laundry weight in kg"
        extraMinutes:
          type: integer
          default: 0
          description: "Extra washing minutes beyond 45 min per load"
        initialAddOns:
          type: array
          items:
            $ref: "#/components/schemas/AddOnInput"
      required: [weightKg]
      description: >
        Provide either customerId OR customer (create on the fly).
        weightKg required. extraMinutes and initialAddOns optional.

    AddOnInput:
      type: object
      properties:
        name: { type: string }
        price: { type: number, format: double }
        quantity: { type: integer, default: 1 }
      required: [name, price]

    OrderPreviewRequest:
      type: object
      properties:
        weightKg:
          type: number
          format: double
          description: "Laundry weight in kg"
        extraMinutes:
          type: integer
          default: 0
          description: "Extra washing minutes beyond 45 min per load"
        initialAddOns:
          type: array
          items:
            $ref: "#/components/schemas/AddOnInput"
      required: [weightKg]

    OrderPreviewResponse:
      type: object
      properties:
        totalLoads: { type: integer }
        baseAmount: { type: number, format: double }
        extraMinutesAmount: { type: number, format: double }
        addonsTotalAmount: { type: number, format: double }
        grandTotal: { type: number, format: double }
      required: [totalLoads, baseAmount, extraMinutesAmount, addonsTotalAmount, grandTotal]

    OrderStatsResponse:
      type: object
      properties:
        todaysOrders: { type: integer }
        inProgress: { type: integer }
        readyForPickup: { type: integer }
        unpaidOrders: { type: integer }
      required: [todaysOrders, inProgress, readyForPickup, unpaidOrders]

    UpdateOrderRequest:
      type: object
      properties:
        extraMinutes: { type: integer, minimum: 0 }
        addOns:
          type: array
          items:
            $ref: "#/components/schemas/AddOnInput"

    UpdateOrderStatusRequest:
      type: object
      properties:
        newStatus:
          $ref: "#/components/schemas/OrderStatus"
        notes:
          type: string
        changedByUserId:
          type: string
          format: uuid
          description: "User who initiated the status change (required until Phase 9 authentication)"
      required: [newStatus, changedByUserId]

    AddOrderAddOnRequest:
      type: object
      properties:
        name: { type: string }
        price: { type: number, format: double }
        quantity: { type: integer, default: 1 }
      required: [name, price]

    OrderResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        referenceNumber: { type: string, description: "Unique tracking identifier" }
        customerId: { type: integer, format: int64 }
        createdByUserId: { type: string, format: uuid }
        # serviceRateId: { type: integer } # OUT OF SCOPE FOR MVP
        weightKg: { type: number, format: double }
        totalLoads: { type: integer, description: "ceil(weight_kg / kg_limit_per_load)" }
        extraMinutes: { type: integer }
        baseAmount: { type: number, format: double }
        extraMinutesAmount: { type: number, format: double }
        addonsTotalAmount: { type: number, format: double }
        grandTotal: { type: number, format: double }
        addOns:
          type: array
          items:
            $ref: "#/components/schemas/AddOnInput"
          description: "Order add-ons (for edit form)"
        currentStatus:
          $ref: "#/components/schemas/OrderStatus"
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - referenceNumber
        - customerId
        - serviceRateId
        - weightKg
        - totalLoads
        - baseAmount
        - extraMinutesAmount
        - addonsTotalAmount
        - grandTotal
        - currentStatus
        - paymentStatus

    OrderPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponse"
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
      required: [content, page, size, totalElements, totalPages, first, last]

    PaymentPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PaymentResponse"
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
      required: [content, page, size, totalElements, totalPages, first, last]

    OrderTrackingResponse:
      type: object
      properties:
        referenceNumber: { type: string }
        currentStatus:
          $ref: "#/components/schemas/OrderStatus"
        customerName: { type: string }
        contactNumber: { type: string }
        createdAt: { type: string, format: date-time }
        grandTotal: { type: number, format: double }
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
      required: [referenceNumber, currentStatus, customerName, createdAt, paymentStatus]

    # -------------------------
    # PAYMENTS
    # -------------------------
    CreatePaymentRequest:
      type: object
      properties:
        orderId: { type: integer, format: int64 }
        amountPaid: { type: number, format: double, description: "Must equal order grand total (BR-PAY-03)" }
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        receivedByUserId:
          type: string
          format: uuid
          description: "User recording the payment. Required until auth (Phase 9)."
      required: [orderId, amountPaid, receivedByUserId]

    PaymentResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        orderReferenceNumber: { type: string, description: "Order reference for display (US-07)" }
        customerName: { type: string, description: "Customer name for display (US-07)" }
        amountPaid: { type: number, format: double }
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        receivedByUserId: { type: string, format: uuid }
        paymentDate: { type: string, format: date-time }
        remarks: { type: string }
      required: [id, orderId, amountPaid, paymentMethod, paymentDate]

    # -------------------------
    # NOTIFICATIONS
    # -------------------------
    NotificationResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        referenceNumber: { type: string }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        contactNumber: { type: string }
        message: { type: string }
        status:
          $ref: "#/components/schemas/NotificationStatus"
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
      required: [id, orderId, customerId, message, status]

    # -------------------------
    # REPORTS
    # -------------------------
    DailySalesReportResponse:
      type: object
      properties:
        date: { type: string, format: date }
        totalIncome: { type: number, format: double }
        paidOrdersCount: { type: integer }
      required: [date, totalIncome, paidOrdersCount]

    PeriodSalesReportResponse:
      type: object
      properties:
        period:
          type: string
          example: "2026-02"
        totalIncome: { type: number, format: double }
        paidOrdersCount: { type: integer }
      required: [period, totalIncome, paidOrdersCount]
