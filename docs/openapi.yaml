openapi: 3.0.3
info:
  title: Laundry Shop Management System API
  version: 0.1.0
  description: |
    MVP API contract for Laundry Shop Management System.

    Roles:
      - STAFF: operational endpoints (orders, status, payments, release)
      - OWNER: reporting endpoints (reports)

    Role-based access control (RBAC) contract:
      - Endpoints with the "Orders" or "Payments" tag are accessible to the STAFF role.
      - Endpoints with the "Reports" tag are accessible to the OWNER role.
      - If an operation summary includes "(STAFF)", it is restricted to the STAFF role.
      - If an operation summary includes "(OWNER)", it is restricted to the OWNER role.
      - Unless otherwise documented on a specific operation, access is determined by these tag/summary rules.

    Frontend and backend implementations MUST treat this mapping as the source of truth for which roles
    are allowed to call which endpoints.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Orders
  - name: Payments
  - name: Reports

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  responses:
    ErrorResponse:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT]
          example: "VALIDATION_ERROR"
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time

    Role:
      type: string
      enum: [OWNER, STAFF]

    OrderStatus:
      type: string
      enum: [RECEIVED, PROCESSING, READY, RELEASED]

    PaymentStatus:
      type: string
      enum: [UNPAID, PAID]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 6
          maxLength: 72

    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"

    UserSummary:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    CustomerCreate:
      type: object
      required: [name, contactNumber]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        contactNumber:
          type: string
          minLength: 7
          maxLength: 30
          pattern: "^[0-9+()\\s-]+$"

    OrderCreateRequest:
      type: object
      required: [customer, serviceType, weightKg]
      properties:
        customer:
          $ref: "#/components/schemas/CustomerCreate"
        serviceType:
          type: string
          description: e.g., Wash/Dry/Fold
          minLength: 2
          maxLength: 60
        weightKg:
          type: number
          format: double
          minimum: 0.1
        specialInstructions:
          type: string
          maxLength: 300
        specialItems:
          type: array
          items:
            type: string
            maxLength: 80
      description: >
        Pricing is calculated server-side based on serviceType and weightKg.
        The client does not provide a total amount in this request. The calculated
        totalAmount will be returned in the OrderResponse after creation.

    OrderResponse:
      type: object
      required: [id, referenceNumber, customerName, serviceType, weightKg, status, paymentStatus, createdAt]
      properties:
        id:
          type: integer
          format: int64
        referenceNumber:
          type: string
          description: Claim stub reference number
        customerName:
          type: string
        customerContactNumber:
          type: string
        serviceType:
          type: string
        weightKg:
          type: number
          format: double
        status:
          $ref: "#/components/schemas/OrderStatus"
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        totalAmount:
          type: number
          format: double
          nullable: true
          description: >
            Total monetary amount for this order. This value may be null when
            the system has not yet determined the final price (for example,
            immediately after the order is created or while pricing is still
            being calculated) or when no charge applies. Clients MUST handle
            both null and non-null values for this field.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    OrderSearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponse"

    OrderStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"

    PaymentCreateRequest:
      type: object
      required: [orderId, amount, paidAt]
      properties:
        orderId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
          minimum: 0.01
        paidAt:
          type: string
          format: date-time
          description: >
            Client-provided payment timestamp. Server-side validation SHOULD
            ensure this timestamp is not in the future and is within a reasonable
            range (e.g., not more than 24 hours in the past).
        method:
          type: string
          description: Cash, GCash, etc.
          maxLength: 30
          nullable: true

    PaymentResponse:
      type: object
      required: [id, orderId, amount, paidAt]
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
        paidAt:
          type: string
          format: date-time
        method:
          type: string
          nullable: true

    ReleaseRequest:
      type: object
      required: [releasedAt]
      properties:
        releasedAt:
          type: string
          format: date-time
          description: >
            Client-provided release timestamp. Server-side validation SHOULD
            ensure this timestamp is not in the future and is within a reasonable
            range to prevent recording releases with arbitrary timestamps.

    ReportDailyResponse:
      type: object
      required: [date, totalSales, transactions]
      properties:
        date:
          type: string
          format: date
        totalSales:
          type: number
          format: double
        transactions:
          type: integer
          format: int32

    ReportMonthlyResponse:
      type: object
      required: [year, month, totalSales, transactions]
      properties:
        year:
          type: integer
          format: int32
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        totalSales:
          type: number
          format: double
        transactions:
          type: integer
          format: int32

    PendingOrdersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponse"

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and obtain JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in successfully. Sets HttpOnly cookie.
          headers:
            Set-Cookie:
              description: >
                Sets the access_token cookie (HttpOnly).
                Example: access_token=JWT; HttpOnly; Secure; Path=/; SameSite=Lax
                Note: The Secure flag should only be used in production environments with HTTPS.
                For local development (http://localhost:8080), the Secure flag should be omitted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (clears auth cookie)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Logged out. Clears auth cookie.
          headers:
            Set-Cookie:
              description: Clears the access_token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: Empty response body indicating successful logout.
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /api/orders:
    post:
      tags: [Orders]
      summary: Create a new laundry order (STAFF)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

    get:
      tags: [Orders]
      summary: Search orders by reference number or customer name (STAFF)
      security:
        - cookieAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSearchResponse"
              examples:
                noResults:
                  summary: No orders match the search query
                  value:
                    items: []
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /api/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order details by id (STAFF)
      security:
        - cookieAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/orders/{orderId}/status:
    patch:
      tags: [Orders]
      summary: Update order status (STAFF)
      description: |
        Allowed transitions (MVP) via this endpoint:
          RECEIVED -> PROCESSING -> READY

        The transition from READY to RELEASED is performed via
        POST /api/orders/{orderId}/release, which will set the
        order status to RELEASED.
      security:
        - cookieAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdateRequest"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /api/payments:
    post:
      tags: [Payments]
      summary: Record a payment for an order (STAFF)
      description: |
        Records a payment for an order. Expected error scenarios:
          - 400: Payment amount exceeds order total or validation fails
          - 404: Order does not exist
          - 409: Order is already fully paid
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreateRequest"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: Validation error (e.g., payment amount exceeds order total)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (e.g., order already fully paid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/orders/{orderId}/release:
    post:
      tags: [Orders]
      summary: Release an order to customer (STAFF)
      description: |
        Business rule (MVP):
          - Only allowed if status == READY AND paymentStatus == PAID
      security:
        - cookieAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseRequest"
      responses:
        "200":
          description: Released order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /api/reports/daily:
    get:
      tags: [Reports]
      summary: Daily sales report (OWNER)
      security:
        - cookieAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDailyResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /api/reports/monthly:
    get:
      tags: [Reports]
      summary: Monthly income report (OWNER)
      security:
        - cookieAuth: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: month
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: Monthly report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportMonthlyResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /api/reports/pending:
    get:
      tags: [Reports]
      summary: Pending orders report (OWNER)
      description: >
        Returns a list of pending orders (not yet released) for reporting and oversight purposes.
        This endpoint is restricted to OWNER role for business oversight.
        STAFF should use GET /api/orders with query parameter to search for specific orders.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Pending orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingOrdersResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
