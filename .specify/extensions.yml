installed:
- brownfield
- bugfix
- harness
- security-review
- superspec
settings:
  auto_execute_hooks: false
hooks:
  after_init:
  - extension: brownfield
    command: speckit.brownfield.scan
    enabled: true
    optional: true
    priority: 10
    prompt: Scan this existing project to customize spec-kit configuration?
    description: Auto-scan project after spec-kit init to detect tech stack and conventions
    condition: null
  after_tasks:
  - extension: superspec
    command: speckit.superspec.tasks
    enabled: true
    optional: true
    priority: 10
    prompt: Run enhanced Superpowers task decomposition and validation?
    description: Verify task coverage and add Superpowers execution markers after
      core task generation
    condition: null
  before_implement:
  - extension: superspec
    command: speckit.superspec.execute
    enabled: true
    optional: true
    priority: 10
    prompt: Run Superpowers-guided implementation with TDD and checkpoints?
    description: Enforce TDD discipline and Superpowers execution guidance before
      core implementation
    condition: null
  after_implement:
  - extension: superspec
    command: speckit.superspec.review
    enabled: true
    optional: true
    priority: 10
    prompt: Run Superpowers review against the specification and implementation?
    description: Review implementation against the spec, plan, tasks, and constitution
    condition: null
  - extension: bugfix
    command: speckit.bugfix.verify
    enabled: true
    optional: true
    priority: 10
    prompt: Run bugfix consistency check after implementation?
    description: Verify spec artifact consistency after implementation completes
    condition: null
  after_specify:
  - extension: harness
    command: speckit.harness.init
    enabled: true
    optional: true
    priority: 10
    prompt: Set up a state-externalized research harness for this feature?
    description: Initialize harness state after specification
    condition: null
  after_plan:
  - extension: harness
    command: speckit.harness.verify
    enabled: true
    optional: true
    priority: 10
    prompt: Verify plan claims against primary sources and the harness evidence base?
    description: Run claim verification after planning
    condition: null
