services:
  db:
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backend/infrastructure/db-init/01-enable-pgcrypto.sql:/docker-entrypoint-initdb.d/01-enable-pgcrypto.sql:ro
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      target: production
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      target: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_prod_data:
