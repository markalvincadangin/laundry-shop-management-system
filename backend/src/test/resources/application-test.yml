# Test profile for integration tests
# Datasource: Injected by Testcontainers via PostgresTestContainerConfig
# PostgreSQL 16 container started automatically when tests run

spring:
  application:
    name: laundryms-backend-test

  # Datasource: Testcontainers PostgreSQL 16 injects URL, username, password
  # See PostgresTestContainerConfig and AbstractIntegrationTest

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholder-replacement: true
    placeholders:
      seed_environment: production

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org:
      springframework:
        test:
          context:
            cache: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
