# Production profile: hardened for the on-premises shop host
# Activate with: SPRING_PROFILES_ACTIVE=prod

server:
  address: 0.0.0.0

spring:
  datasource:
    # PostgreSQL runs in Docker container or on host
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME}?stringtype=unspecified

  # --- Flyway: production & demo settings ---
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/dev-migration}
    group: true
    out-of-order: false

  # --- JPA: validate-only, no auto-DDL ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    org:
      hibernate:
        SQL: warn
    com.himotech: info
    org.flywaydb: info

app:
  security:
    cookie-secure: true
    cookie-same-site: Lax
    bcrypt-strength: 12
