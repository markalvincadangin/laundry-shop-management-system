# Production profile: hardened for the on-premises shop host
# Activate with: SPRING_PROFILES_ACTIVE=prod

server:
  address: 127.0.0.1

spring:
  datasource:
    # PostgreSQL runs on the same shop-host laptop as the application.
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME}?stringtype=unspecified

  # --- Flyway: production settings ---
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    group: true
    out-of-order: false

  # --- JPA: validate-only, no auto-DDL ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    org:
      hibernate:
        SQL: warn
    com.himotech: info
    org.flywaydb: info

app:
  security:
    cookie-secure: true
    cookie-same-site: Lax
    bcrypt-strength: 12
