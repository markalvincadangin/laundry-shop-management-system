# Production profile: hardened for Render + Neon deployment
# Activate with: SPRING_PROFILES_ACTIVE=prod

spring:
  datasource:
    # Neon requires SSL for external connections from Render
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?stringtype=unspecified&sslmode=require

  # --- Flyway: production settings ---
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    group: true
    out-of-order: false

  # --- JPA: validate-only, no auto-DDL ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    org:
      hibernate:
        SQL: warn
    com.himotech: info
    org.flywaydb: info

app:
  security:
    cookie-secure: true
    cookie-same-site: Lax
    bcrypt-strength: 12
