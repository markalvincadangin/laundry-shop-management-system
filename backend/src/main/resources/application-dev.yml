# Development profile: request/response logging, verbose logs
spring:
  main:
    lazy-initialization: true
  jpa:
    show-sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/dev-migration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:laundry_db}?stringtype=unspecified

logging:
  level:
    org:
      hibernate:
        SQL: debug
    com.himotech.laundryms.config.RequestResponseLoggingFilter: debug
    com.himotech: debug

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-secret-change-in-production-minimum-32-characters-required}
