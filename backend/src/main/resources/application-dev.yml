# Development profile: request/response logging, verbose logs
spring:
  main:
    lazy-initialization: true
  jpa:
    show-sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/dev-migration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:laundryms}?stringtype=unspecified

logging:
  level:
    org:
      hibernate:
        SQL: debug
    com.himotech.laundryms.config.RequestResponseLoggingFilter: debug
    com.himotech: debug
