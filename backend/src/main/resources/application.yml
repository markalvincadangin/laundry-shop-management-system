server:
  port: ${SPRING_PORT:8080}

spring:
  application:
    name: laundry-system

  datasource:
    # Syntax: ${VAR_NAME:default_value}
    # WARNING: DB_PASSWORD default is for development only - MUST be set via environment variable in production
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:laundry_db}
    username: ${DB_USER:laundry_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    placeholder-replacement: true
    placeholders:
      # Controls whether seed users are created in migrations
      # Set to 'dev' to enable seed users, defaults to 'production' (no seed users)
      seed_environment: ${SPRING_PROFILES_ACTIVE:production}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org:
      hibernate:
        SQL: debug

app:
  security:
    cookie-name: access_token
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:3000}
    jwt-secret: ${JWT_SECRET:dev-only-change-me}