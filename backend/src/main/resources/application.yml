server:
  port: ${SPRING_PORT:8080}

spring:
  application:
    name: laundry-system

  datasource:
    # Syntax: ${VAR_NAME:default_value}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:laundry_db}
    username: ${DB_USER:laundry_user}
    password: ${DB_PASSWORD:your_secure_password_here}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org:
      hibernate:
        SQL: debug