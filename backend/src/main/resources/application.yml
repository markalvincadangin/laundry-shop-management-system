server:
  port: ${SPRING_PORT:8080}

spring:
  application:
    name: laundryms-backend

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true # Keep true for Swagger UI, but allow 404 exceptions for API paths

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  datasource:
    # Syntax: ${VAR_NAME:default_value}
    # WARNING: DB_PASSWORD default is for development only - MUST be set via environment variable in production
    # CRITICAL: ?stringtype=unspecified enables PostgreSQL enum compatibility (order_status, payment_status, etc.)
    # DB_PORT defaults: 5433 for local dev (host-mapped), overridden to 5432 in application-prod.yml
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5433}/${DB_NAME}?stringtype=unspecified
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true
    # Group all pending migrations in a single transaction (Standard)
    group: true
    # Prevent running migrations out of order (Standard for production)
    out-of-order: false
    placeholder-replacement: true
    placeholders:
      # Controls whether seed users are created in migrations
      # Set to 'dev' to enable seed users, defaults to 'production' (no seed users)
      seed_environment: ${SPRING_PROFILES_ACTIVE:production}
      # Optional development seed placeholders. Keep empty unless intentionally seeding users.
      seed_admin_username: ${SEED_ADMIN_USERNAME:}
      seed_admin_password_hash: ${SEED_ADMIN_PASSWORD_HASH:}
      seed_staff_username: ${SEED_STAFF_USERNAME:}
      seed_staff_password_hash: ${SEED_STAFF_PASSWORD_HASH:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # dialect is auto-detected from JDBC URL — do not set explicitly (Hibernate 6+ deprecation)
        jdbc:
          time_zone: UTC

logging:
  level:
    org:
      hibernate:
        SQL: warn

app:
  security:
    cookie-name: access_token
    cookie-secure: false          # Overridden to true in application-prod.yml
    cookie-same-site: Lax
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:3000}
    allowed-origin-patterns: ${ALLOWED_ORIGIN_PATTERNS:}
    jwt-secret: ${JWT_SECRET}
  sms:
    semaphore:
      api-key: ${SEMAPHORE_API_KEY:}
      sender-name: ${SEMAPHORE_SENDER_NAME:FaithLaundry}
    template: "Hi %s, your order #%s from Faith Laundry is ready for pickup! Total: P%s. See you soon!"
