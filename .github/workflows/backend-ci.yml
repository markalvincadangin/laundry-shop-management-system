name: Backend CI

on:
  push:
    branches: [ "develop", "main" ]
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "develop", "main" ]
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start Postgres via docker compose
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..30}; do
            docker exec laundry-postgres pg_isready -U laundry_user -d laundry_db && exit 0
            sleep 2
          done
          echo "Postgres not ready" && docker logs laundry-postgres && exit 1

      - name: Run backend tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: laundry_db
          DB_USER: laundry_user
          DB_PASSWORD: laundry_password
          SPRING_PORT: 8080
        run: mvn -B -ntp clean test

      - name: Package
        working-directory: backend
        run: mvn -B -ntp package -DskipTests

      - name: Shutdown containers
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
