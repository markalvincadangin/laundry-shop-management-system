name: Frontend CI

on:
  push:
    branches: [ "develop", "main" ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'

  lint-build:
    needs: check-changes
    if: needs.check-changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check-frontend
        run: |
          if [ -d "frontend" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Frontend directory not found - skipping workflow"
          fi

      - name: Set up Node.js 20
        if: steps.check-frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run test

      # Optional but strongly recommended for TS projects:
      - name: Typecheck
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build
